<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
<title>RMM System conceptual architecture</title>
<rect width="640" height="480" fill="#f8fafc"/>
<g fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="12">

<rect x="40" y="16" width="560" height="68" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
<text x="320" y="38" text-anchor="middle" font-weight="bold">Managed endpoints</text>
<text x="320" y="55" text-anchor="middle" font-size="11" fill="#334155">Linux &amp; Windows servers and workstations (macOS planned)</text>
<text x="320" y="70" text-anchor="middle" font-size="10" fill="#334155">Agents · local console · collectors</text>

<line x1="170" y1="84" x2="170" y2="108" stroke="#475569" stroke-width="2"/>
<polygon points="170,116 164,108 176,108" fill="#475569"/>
<line x1="470" y1="84" x2="470" y2="108" stroke="#475569" stroke-width="2"/>
<polygon points="470,116 464,108 476,108" fill="#475569"/>

<rect x="40" y="116" width="260" height="44" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1"/>
<text x="170" y="134" text-anchor="middle" font-weight="bold">HTTPS + JWT</text>
<text x="170" y="149" text-anchor="middle" font-size="10" fill="#334155">(after enrollment)</text>

<rect x="340" y="116" width="260" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="470" y="143" text-anchor="middle" font-weight="bold">Metrics and logs</text>

<line x1="170" y1="160" x2="170" y2="176" stroke="#475569" stroke-width="2"/>
<polygon points="170,184 164,176 176,176" fill="#475569"/>
<line x1="470" y1="160" x2="470" y2="176" stroke="#475569" stroke-width="2"/>
<polygon points="470,184 464,176 476,176" fill="#475569"/>

<rect x="40" y="184" width="260" height="116" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
<text x="170" y="206" text-anchor="middle" font-weight="bold">Backend API</text>
<text x="170" y="222" text-anchor="middle" font-size="10" fill="#334155">Inventory, jobs, policies, approvals</text>
<line x1="60" y1="236" x2="280" y2="236" stroke="#cbd5e1" stroke-width="1"/>
<text x="170" y="260" text-anchor="middle" font-weight="bold">PostgreSQL</text>
<text x="170" y="276" text-anchor="middle" font-size="10" fill="#334155">System of record</text>

<rect x="340" y="184" width="260" height="116" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<text x="470" y="206" text-anchor="middle" font-weight="bold">Mon</text>
<text x="470" y="222" text-anchor="middle" font-size="11" fill="#334155">Monitoring stack</text>
<line x1="360" y1="236" x2="580" y2="236" stroke="#bfdbfe" stroke-width="1"/>
<text x="470" y="260" text-anchor="middle" font-size="10" fill="#334155">Prometheus · Grafana</text>
<text x="470" y="276" text-anchor="middle" font-size="10" fill="#334155">Loki · Alertmanager</text>

<line x1="170" y1="300" x2="170" y2="324" stroke="#475569" stroke-width="2"/>
<polygon points="170,332 164,324 176,324" fill="#475569"/>
<line x1="470" y1="300" x2="470" y2="324" stroke="#475569" stroke-width="2"/>
<polygon points="470,332 464,324 476,324" fill="#475569"/>

<rect x="40" y="332" width="560" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
<text x="320" y="354" text-anchor="middle" font-weight="bold">Operator web panel</text>
<text x="320" y="370" text-anchor="middle" font-size="11" fill="#334155">Fleet, jobs, alerts, backups, and policies</text>

<text x="320" y="420" text-anchor="middle" fill="#475569" font-size="10">Conceptual - public overview only</text>
</g>
</svg>
